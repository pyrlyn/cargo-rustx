[workspace]
members = ["crates/rustx-core", "crates/rustx-macros", "crates/rustx", "crates/rustx-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/pyrlyn/cargo-rustx"

[workspace.dependencies]
rustx-core = { path = "crates/rustx-core", version = "=0.1.0" }
rustx-macros = { path = "crates/rustx-macros", version = "=0.1.0" }
# `T throws` returns `anyhow::Result<T>`; reached through the `rustx` re-export.
anyhow = "1.0.104"
proc-macro2 = "1"
quote = "1"
# `full` parses whole items (the `sugar!` body is a file of items); `visit-mut` drives the AST passes.
syn = { version = "3", features = ["full", "visit-mut", "extra-traits"] }
# rustx-cli
clap = { version = "4.6", features = ["derive"] }
prettyplease = "0.3"
# tests
insta = { version = "1", features = ["glob"] }
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
